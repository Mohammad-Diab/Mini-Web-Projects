<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>

<body>
    <div class="container">
        <div class="form">
            <h1>Login to your account</h1>
            <div class="form-div username">
                <div class="input-img"></div>
                <input onfocus="inputFocus" onblur="inputBlur" class="username-input" placeholder="Username" type="text" />
            </div>

            <div class="form-div password">
                <div class="input-img"></div>
                <input onfocus="inputFocus" onblur="inputBlur" placeholder="Password" type="password" />
            </div>
            <button class="form-div login">Login</button>
        </div>
    </div>
</body>

</html>
