<!DOCTYPE html>

<head>

    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title>Toggle Button</title>
</head>

<body>
    <div class="fd-toggleButton">
        <input id="toogleSample" type="checKbox" data-onCaption="On" />
        <label for="toogleSample">Do What do you want.</label>
        <label class="fd-toggleButton-caption">Off</label>
    </div>

    <div class="fd-toggleButton">
        <input id="toogleButtonSampleDisabled1" type="checKbox" data-onCaption="On" disabled/>
        <label for="toogleButtonSampleDisabled1">This is disabled</label>
        <label class="fd-toggleButton-caption">Off</label>
    </div>
    <div class="fd-toggleButton">

    </div>

    <div class="fd-toggleButton">

        <label for="toogleButtonSampleDisabled6">This is disabled</label>

    </div>

    <script src="script.js"></script>
</body>

</html>
