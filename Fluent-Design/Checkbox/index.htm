<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title>Checkbox</title>
</head>

<body>
    <div class="fd-checkbox">
        <input id="radioSample1" type="checkbox" />
        <label for="radioSample1">I'm a checkbox.</label>
    </div>

    <div class="fd-checkbox">
        <input id="radioSample2" type="checkbox" />
        <label for="radioSample2">I'm another one.</label>
    </div>

    <div class="fd-checkbox">
        <input id="radioSample3" type="checkbox" />
        <label for="radioSample3">I'm another one.</label>
    </div>

    <div class="fd-checkbox">
        <input id="radioSample4" type="checkbox" />
        <label for="radioSample4">I'm another one.</label>
    </div>


    <div class="fd-checkbox">
        <input id="radioSample7" type="checkbox" disabled/>
        <label for="radioSample7">I'm a disabled checkbox.</label>
    </div>

    <div class="fd-checkbox">
        <input id="radioSample7" type="checkbox" checked disabled/>
        <label for="radioSample7">I'm a disabled checked checkbox.</label>
    </div>

    <div class="fd-checkbox disabled">
        <input id="radioSample8" type="checkbox" />
        <label for="radioSample8">I'm a disabled checkbox with alternative way.</label>
    </div>

    <script src="script.js"></script>
</body>

</html>
