<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title>ProgressBar</title>
</head>

<body>
    <h4>Normal progress bar.</h4>
    <div data-value="80" class="fd-progressBar">
    </div>
    <h4>Linear indeterminate progress bar.</h4>
    <div class="fd-progressBar indeterminate">
    </div>
    <h4>Circular indeterminate progress bar.</h4>
    <div class="fd-progressBar indeterminate circle">
    </div>
    <script src="script.js"></script>
</body>

</html>
