<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title>Button</title>
</head>

<body>
    <a href="#" class="fd-button">I am a button</a>
    <br/>
    <input type="submit" class="fd-button" value="I am a button" />
    <br/>
    <input type="button" class="fd-button" value="I am a button" />
    <br/>
    <button class="fd-button">I am a button</button>
    <br/>
    <button class="fd-button" disabled="disabled">I am a button</button>
    <br/>
    <button class="fd-button disabled">I am a disabled button with alternative way</button>
    <script src="script.js"></script>
</body>
