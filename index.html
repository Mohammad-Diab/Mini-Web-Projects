<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Web Projects</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f6f6f4;
            --card: #ffffff;
            --text: #1f1f1f;
            --muted: #5f5f5f;
            --line: #e2e2de;
            --accent: #0067c0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1c1c;
                --card: #262626;
                --text: #f0f0f0;
                --muted: #a8a8a8;
                --line: #383838;
                --accent: #60b2f0;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 48px 16px;
            background: var(--bg);
            color: var(--text);
            font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 28px;
            font-weight: 600;
        }

        header p {
            margin: 0 0 32px;
            color: var(--muted);
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 12px;
        }

        a.project {
            display: block;
            padding: 16px 20px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            color: inherit;
            text-decoration: none;
            transition: border-color .15s;
        }

        a.project:hover,
        a.project:focus-visible {
            border-color: var(--accent);
        }

        .title {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: baseline;
        }

        .name {
            color: var(--accent);
            font-weight: 600;
            font-size: 18px;
        }

        .year {
            color: var(--muted);
            font-size: 14px;
        }

        .description {
            margin: 4px 0 0;
            color: var(--muted);
        }

        footer {
            margin-top: 32px;
            font-size: 14px;
            color: var(--muted);
        }

        footer a {
            color: var(--accent);
        }
    </style>
</head>

<body>
    <main>
        <header>
            <h1>Mini Web Projects</h1>
            <p>Small web projects by Mohammad Diab, each in its own folder.</p>
        </header>
        <ul>
            <li>
                <a class="project" href="Fluent-Design/">
                    <span class="title"><span class="name">Fluent Design</span><span class="year">2019</span></span>
                    <p class="description">Six UI controls styled after Microsoft's Fluent Design: buttons, checkboxes, links, progress bars, radio buttons and toggle switches.</p>
                </a>
            </li>
        </ul>
        <footer>
            Source on <a href="https://github.com/Mohammad-Diab/Mini-Web-Projects">GitHub</a>
        </footer>
    </main>
</body>

</html>
