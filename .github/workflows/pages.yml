name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir _site
          git ls-files -z | xargs -0 cp --parents -t _site
          rm -rf _site/.github
          find _site -name index.htm -execdir sh -c '[ -e index.html ] || cp index.htm index.html' \;
          for d in _site/*/; do
            page=$(ls "$d" | grep -m1 -E '\.html?$' || true)
            if [ ! -e "${d}index.html" ] && [ -n "$page" ]; then cp "$d$page" "${d}index.html"; fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
